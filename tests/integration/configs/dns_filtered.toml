# DNS-filtered network mode — pasta with domain-based allowlist.
# Used by: t_dns_filtering.sh
#
# Uses `[unsafe] unfiltered_egress` (not `proxy`) because this test
# exercises the supervisor's *direct* connect filter against the dynamic
# allow list populated from the `[[host]]` table. In `proxy` mode the
# supervisor unconditionally denies any non-proxy egress (see
# ADR-0006), so the dynamic allow list is never consulted.

[filesystem]
read = ["/usr/lib", "/usr/bin", "/usr/local", "/lib", "/lib64", "/tmp"]

[unsafe]
unfiltered_egress = true

[[host]]
domain = "example.com"

[[host]]
domain = "httpbin.org"

[process]
env_passthrough = ["PATH", "HOME", "LANG", "TERM"]

[syscalls]
